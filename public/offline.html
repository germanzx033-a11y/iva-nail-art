<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVA Nail Art - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #FDF8F6 0%, #F8E8E0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      color: #4A0404;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #D4AF37;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .dm-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #F58529 0%, #DD2A7B 50%, #8134AF 100%);
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .dm-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(221, 42, 123, 0.4);
    }

    .dm-icon {
      width: 24px;
      height: 24px;
    }

    .retry-btn {
      display: block;
      margin-top: 20px;
      color: #4A0404;
      text-decoration: none;
      font-size: 14px;
    }

    .retry-btn:hover {
      text-decoration: underline;
    }

    .contact-info {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(74, 4, 4, 0.1);
    }

    .contact-info p {
      font-size: 14px;
      color: #888;
      margin-bottom: 5px;
    }

    .contact-info strong {
      color: #4A0404;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💅</div>
    <h1>IVA Nail Art</h1>
    <div class="subtitle">Luxury Nails · Brooklyn</div>

    <p>
      You're currently offline, but you can still message us directly on Instagram to book your appointment!
    </p>

    <a href="https://ig.me/m/iva_nailart_nyc" class="dm-btn">
      <svg class="dm-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      Message us on Instagram
    </a>

    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">
      ↻ Try again
    </a>

    <div class="contact-info">
      <p><strong>Phone:</strong> (929) 625-7273</p>
      <p><strong>Location:</strong> Bay Ridge, Brooklyn</p>
      <p><strong>Hours:</strong> By Appointment Only</p>
    </div>
  </div>
</body>
</html>
